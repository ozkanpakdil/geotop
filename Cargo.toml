[package]
name = "geotop"
version = "0.1.4"
edition = "2021"
resolver = "2"
authors = ["geotop contributors"]
description = "htop-style real-time network & log monitor with live global geolocation map"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ozkanpakdil/geotop"
readme = "README.md"
keywords = ["network", "monitor", "tui", "geolocation", "ratatui"]
categories = ["network-programming", "command-line-utilities", "visualization", "gui"]

[dependencies]
# TUI
ratatui = { version = "0.30", features = ["serde", "macros"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
# image crate (for in-memory map manipulation)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Transitive pin: `image` pulls `zune-jpeg` -> `zune-core`.  zune-core 0.5.2
# rewrote its `__warn` logging macro in a way that makes zune-jpeg 0.5.15's
# trailing-expression `warn!(...)` at mcu_prog.rs:463 fail under rustc 1.93+.
# `cargo install` re-resolves deps fresh (no lockfile ships with a library),
# so without this pin it grabs zune-core 0.5.2 and breaks the build.  0.5.1
# compiles cleanly.  Remove this pin once zune-jpeg/zune-core ship a fix.
zune-core = "=0.5.1"
# SVG rasterization for bundled/default world map
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
# GUI mode
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
# IP / Packet handling
# 0.35 pulls pnet_datalink 0.35, which fixes a misaligned-pointer panic in the
# macOS BPF read loop (0.34 read bpf_hdr from a 14-byte offset → UB-check
# abort under `--all-interfaces` on utun/ethernet in debug builds).
pnet = { version = "0.35", features = ["serde"] }
# IP geolocation (kept in sync with `GeoSentinel-Ingress` 0.1)
ip2location = "0.6"
# Open the user's browser to the IP2Location token signup page when no token is set
webbrowser = "1.0"
# File watching
notify = "6.1"
notify-debouncer-mini = "0.4"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Errors / utils
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Regex parsing for log formats
regex = "1.10"
once_cell = "1"
# Concurrency primitives
parking_lot = "0.12"
dashmap = "6"
# LRU cache
lru = "0.12"
# Lock-free live swap for hot-reloaded databases (matches GeoSentinel).
arc-swap = "1"
# HTTP client (DB downloader)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# Zip extraction (matches GeoSentinel – no shelling out to `unzip`).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Async helpers
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
# XDG-aware config paths (~/.local/share/geotop)
directories = "5"
geojson = "1.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
