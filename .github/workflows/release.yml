name: Release

# Build geotop for macOS, Linux and Windows on every version tag (v*) and
# attach the stripped release binaries to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: geotop
            archive: geotop-x86_64-unknown-linux-gnu.tar.gz
          # macOS (Apple Silicon) — native build
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: geotop
            archive: geotop-aarch64-apple-darwin.tar.gz
          # macOS (Intel) — cross-compiled from an Apple Silicon runner.
          # GitHub retired the macos-13 (Intel) runner image; there is no newer
          # Intel macOS runner. macOS toolchains + system frameworks are
          # universal, so x86_64-apple-darwin cross-compiles cleanly on arm64
          # with no C cross-toolchain required.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: geotop
            archive: geotop-x86_64-apple-darwin.tar.gz
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: geotop.exe
            archive: geotop-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- Native dependencies -------------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpcap-dev libwayland-dev
          # Only these are FFI-linked at build time:
          #   libpcap-dev    -> pnet (raw datalink channel)
          #   libwayland-dev -> wayland-sys (winit Wayland backend)
          #   pkg-config     -> wayland-sys build script locates libwayland
          # The rest of the GUI stack needs nothing at link time:
          #   - winit's X11 backend uses the pure-Rust `x11rb` crate (no libxcb)
          #   - `x11-dl` and `xkbcommon-dl` dlopen their libs at *runtime*
          #   - resvg/fontdb use the pure-Rust `fontconfig-parser` (no libfontconfig FFI)

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pnet requires the Npcap SDK headers/libs to build on Windows.
          $sdk = "$env:GITHUB_WORKSPACE\npcap-sdk"
          $url = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri $url -OutFile sdk.zip
          Expand-Archive -Path sdk.zip -DestinationPath $sdk -Force
          # The SDK ships x64 libs under Lib/x64 and headers under Include.
          echo "LIB=$sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV
          echo "INCLUDE=$sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      # --- Build --------------------------------------------------------------

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact }}

      # NOTE: the map GeoJSON is embedded into the binary at compile time via
      # `include_bytes!` in map_renderer.rs, so the release binary is fully
      # self-contained — no external assets need to be shipped alongside it.
      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} staging/
          tar -czf ${{ matrix.archive }} -C staging .

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact }} staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive }}

      # Sanity check: confirm the embedded GeoJSON is actually inside the binary,
      # so a crates.io / release install never silently falls back to the
      # procedural map due to a missing asset.
      - name: Verify map is embedded in binary (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          # The bundled GeoJSON starts with a GeoJSON FeatureCollection marker.
          if grep -aq '"type":"FeatureCollection"\|"type": "FeatureCollection"' "$bin"; then
            echo "OK: embedded GeoJSON found in binary"
          else
            echo "ERROR: GeoJSON marker not found in binary — map may not be bundled!"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS universal2 build — Apple-signed + notarized
  # ---------------------------------------------------------------------------
  # Merges the arm64 and x86_64 Mach-Os from the `build` job into one universal
  # binary, signs it with a Developer ID Application certificate, and submits
  # it to Apple's notarization service. The result ships as a single
  # `geotop-darwin-universal.tar.gz` asset so Mac users never have to pick an
  # architecture, and so the direct download opens without the Gatekeeper
  # "unidentified developer" warning.
  #
  # This job always runs to completion (it no-ops when the signing secrets are
  # absent) so that the `release` job — which depends on it — is never blocked
  # by a skipped dependency. Without the secrets the per-arch macOS tarballs
  # from `build` still ship, just unsigned.
  #
  # Required GitHub secrets (add under Settings → Secrets → Actions):
  #   APPLE_DEVELOPER_ID_CERT_P12          base64 of the Developer ID
  #                                       Application .p12 (key + cert)
  #   APPLE_DEVELOPER_ID_CERT_P12_PASSWORD  password for that .p12
  #   APPLE_DEVELOPER_ID_NAME              e.g.
  #                                       "Developer ID Application: Ozkan Pakdil (TEAMID)"
  #   APPLE_API_KEY                        base64 of the App Store Connect
  #                                       API key .p8 (App Manager role)
  #   APPLE_API_KEY_ID                     the key ID (e.g. ABCD123456)
  #   APPLE_API_ISSUER                     the issuer UUID
  notarize-macos:
    name: macOS universal2 (signed + notarized)
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      # Job-level env so we can detect presence without injecting the value
      # into a script body (kept empty if the secret is unset).
      APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
    steps:
      - name: Detect signing secrets
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_CERT_P12" ]; then
            echo "HAS_SECRETS=true" >> "$GITHUB_ENV"
            echo "::notice::Apple signing secrets present — will build, sign & notarize the universal macOS binary."
          else
            echo "HAS_SECRETS=false" >> "$GITHUB_ENV"
            echo "::notice::Apple signing secrets not configured — skipping notarization. Per-arch macOS tarballs still ship unsigned. See release.yml for the required secrets."
          fi

      - name: Download aarch64 binary
        if: env.HAS_SECRETS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: geotop-aarch64-apple-darwin.tar.gz

      - name: Download x86_64 binary
        if: env.HAS_SECRETS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: geotop-x86_64-apple-darwin.tar.gz

      - name: Create universal2 binary
        if: env.HAS_SECRETS == 'true'
        run: |
          mkdir -p arm64 x86
          tar -xzf geotop-aarch64-apple-darwin.tar.gz -C arm64
          tar -xzf geotop-x86_64-apple-darwin.tar.gz   -C x86
          lipo -create -output geotop arm64/geotop x86/geotop
          echo "Universal binary arches:"
          lipo -info geotop

      - name: Import Developer ID certificate
        if: env.HAS_SECRETS == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_DEVELOPER_ID_CERT_P12_PASSWORD" -T /usr/bin/codesign
          # Let codesign access the imported key without a GUI prompt.
          #   -s  only touch keys that can sign (the codesigning key)
          #   -k  keychain password
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN"
          echo "KC_PW=$KC_PW" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Codesign (hardened runtime)
        if: env.HAS_SECRETS == 'true'
        env:
          APPLE_DEVELOPER_ID_NAME: ${{ secrets.APPLE_DEVELOPER_ID_NAME }}
        run: |
          codesign --force --options runtime --keychain "$KEYCHAIN" \
            --identifier "com.ozkanpakdil.geotop" \
            --sign "$APPLE_DEVELOPER_ID_NAME" geotop
          echo "Signature verification:"
          codesign --verify --verbose=4 geotop

      - name: Notarize
        if: env.HAS_SECRETS == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY" | base64 -d > AuthKey.p8
          # notarytool accepts a zip containing a single Mach-O command-line tool.
          ditto -c -k --keepParent geotop geotop-universal.zip
          xcrun notarytool submit geotop-universal.zip \
            --key AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Package universal tarball
        if: env.HAS_SECRETS == 'true'
        run: |
          tar -czf geotop-darwin-universal.tar.gz geotop
          echo "sha256 for the Homebrew cask:"
          shasum -a 256 geotop-darwin-universal.tar.gz

      - name: Upload universal artifact
        if: env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geotop-darwin-universal.tar.gz
          path: geotop-darwin-universal.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, notarize-macos]
    runs-on: ubuntu-latest
    # Only create a release for actual tag pushes; skip for manual runs.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # git-cliff needs the full tag history to compute the range between
        # the previous release tag and the one being cut.
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Only the section for the tag being released (prev tag..this tag),
          # with the changelog header stripped so it is a clean release body.
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      # Print the sha256 of the notarized universal asset. The next step bumps
      # the in-repo cask automatically; this print also lets anyone update the
      # cask by hand if needed.
      - name: Print macOS universal sha256 (for the Homebrew cask)
        run: |
          if [ -f artifacts/geotop-darwin-universal.tar.gz ]; then
            echo "geotop-darwin-universal.tar.gz sha256:"
            shasum -a 256 artifacts/geotop-darwin-universal.tar.gz
          else
            echo "No universal macOS asset (notarization skipped — signing secrets not configured)."
          fi

      # Bump version + sha256 in the in-repo cask (Casks/geotop.rb) and commit
      # straight to the default branch with the default GITHUB_TOKEN — no
      # second repository, no PAT. No-ops if there is no notarized universal
      # asset (signing secrets not configured).
      - name: Bump Homebrew cask (in-repo)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f artifacts/geotop-darwin-universal.tar.gz ]; then
            echo "No universal asset to publish to the cask; skipping bump."
            exit 0
          fi
          SHA="$(shasum -a 256 artifacts/geotop-darwin-universal.tar.gz | awk '{print $1}')"
          VERSION="${GITHUB_REF_NAME#v}"
          # The checkout for this job is at the tag (detached HEAD); switch to
          # the default branch so the cask bump lands there, not on the tag.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          sed -i.bak -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/geotop.rb
          sed -i.bak -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/"       Casks/geotop.rb
          rm -f Casks/geotop.rb.bak
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/geotop.rb
          git commit -m "chore(brew): geotop ${VERSION} (sha256 ${SHA})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$DEFAULT_BRANCH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: artifacts/*

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Verify the package builds & the embedded assets are present before publishing.
      - name: Cargo package sanity check
        run: cargo package --no-verify

      - name: Verify bundled assets are in the package
        run: |
          tar -tzf target/package/*.crate | grep -q 'assets/natural-earth-110m-land.geojson' \
            || { echo "GeoJSON missing from published crate!"; exit 1; }

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          cargo publish --no-verify > /tmp/publish.log 2>&1
          status=$?
          set -e
          cat /tmp/publish.log
          if [ $status -eq 0 ]; then
            echo "published"
          elif grep -q "already exists" /tmp/publish.log; then
            echo "::notice::crate version already on crates.io; skipping publish"
          else
            exit 1
          fi