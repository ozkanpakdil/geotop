# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Generates user-facing release notes from Conventional Commits.
# Run automatically in .github/workflows/release.yml on every `v*` tag push.
#
# Commits are grouped by type; `ci`, `chore`, `docs`, `style`, `test`,
# `build` and `revert` are dropped as they are not interesting to people
# deciding whether to upgrade. History effectively starts at v0.1.1 — the
# first generated changelog is the next release (range: v0.1.1..next tag),
# so the older non-conventional commits never surface.

[changelog]
header = ""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
    {% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Keep non-conventional commits instead of dropping them silently — they fall
# into the "Other" bucket via the catch-all parser below so nothing user-
# relevant is lost when a commit message forgets the conventional prefix.
filter_unconventional = false
require_conventional_multiline = false
split_commits = false
# Only consider `v0.1.1`-style tags when computing release ranges.
tag_pattern = "v[0-9].*"

# Parse order matters: the first matching parser wins, so the `skip` rules
# below must come before the catch-all.
[[git.commit_parsers]]
message = "^feat"
group = "Features"

[[git.commit_parsers]]
message = "^fix"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^perf"
group = "Performance"

[[git.commit_parsers]]
message = "^refactor"
group = "Refactor"

[[git.commit_parsers]]
message = "^ci"
skip = true

[[git.commit_parsers]]
message = "^chore"
skip = true

[[git.commit_parsers]]
message = "^docs"
skip = true

[[git.commit_parsers]]
message = "^style"
skip = true

[[git.commit_parsers]]
message = "^test"
skip = true

[[git.commit_parsers]]
message = "^build"
skip = true

[[git.commit_parsers]]
message = "^revert"
skip = true

# Safety net: anything not matching a conventional type above lands here so
# it is surfaced rather than silently dropped.
[[git.commit_parsers]]
message = ".*"
group = "Other"